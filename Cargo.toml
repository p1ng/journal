[package]
name = "journal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small offline desktop journal"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "accesskit", "persistence"] }
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }
chrono = "0.4"
directories = "6"
tempfile = "3"
zeroize = "1"
anyhow = "1"
